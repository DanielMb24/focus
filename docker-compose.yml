version: "3.9"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  api:
    build: ./server
    ports: ["4000:4000"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/productivity
      STORAGE_DIR: /app/uploads
    volumes: ["./server/uploads:/app/uploads"]
    depends_on: [mongo]
volumes:
  mongo-data:
